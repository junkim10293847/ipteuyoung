<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="입트영 암기">
<meta name="theme-color" content="#2f6b4f">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="config.js"></script>
<title>입트영 주간 암기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
[hidden]{display:none!important}
/* Layout: week chips → week header with Mon–Sat plan → day tabs → sentence cards; sticky audio dock at bottom */
:root{
  --bg:#f3f5f1; --surface:#ffffff; --fg:#1f2620; --muted:#66705f; --line:#dde3d6;
  --accent:#2f6b4f; --accent-soft:#e2eee6; --done:#b07a1e; --done-soft:#f6ecd8; --warn:#a8432f;
  --display:'Fraunces',Georgia,serif; --body:'Noto Sans KR',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141814; --surface:#1d231e; --fg:#e7ece4; --muted:#9aa595; --line:#2e372f;
  --accent:#7cc39c; --accent-soft:#233229; --done:#e0b25c; --done-soft:#3a3020; --warn:#e78a72; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141814; --surface:#1d231e; --fg:#e7ece4; --muted:#9aa595; --line:#2e372f;
  --accent:#7cc39c; --accent-soft:#233229; --done:#e0b25c; --done-soft:#3a3020; --warn:#e78a72; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:.9375rem;line-height:1.55}
html{font-size:16px}
.wrap{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:18px 160px}
.eyebrow{font-size:.75rem;letter-spacing:.08em;color:var(--muted);font-weight:700}
h1{font-family:var(--display);font-weight:700;font-size:1.9rem;margin:.1rem 0 0;text-wrap:balance;line-height:1.15}
.meta{color:var(--muted);font-size:.88rem;margin:.3rem 0 0}
.meta b{color:var(--accent)}
.scroller{overflow-x:auto;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
.row{display:flex;gap:6px;width:max-content;padding-block:2px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:7px 12px;border-radius:999px;font:inherit;font-size:.84rem;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.chip.add{border-style:dashed;color:var(--accent);font-weight:700}
.weeks{margin-bottom:16px}
.head{margin-bottom:14px}
.plan{margin:8px 0 10px}
.long{margin-top:12px;background:var(--accent-soft);border-radius:12px;padding:10px 12px;display:grid;gap:6px}
.long-h{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;font-size:.88rem}
.long-h span{font-size:.78rem;color:var(--muted)}
.long audio{width:100%;height:36px}
.long a{font-size:.8rem;color:var(--accent);font-weight:700}
.long-act{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.long-act .primary{padding:7px 14px;font-size:.85rem}
.pace{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:14px}
.pace span{font-size:.8rem;font-weight:700;color:var(--muted);margin-right:2px}
.pace .chip{padding:5px 10px;font-size:.8rem}
.pace .chip.off{opacity:.35;cursor:not-allowed;text-decoration:line-through}
.hint.auto{color:var(--fg);background:var(--accent-soft);border-radius:8px;padding:6px 10px;margin:6px 0 0}
.hint.warn{color:var(--warn);margin-bottom:6px}
.day{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;min-width:74px;text-align:center;cursor:pointer;font:inherit;color:var(--fg)}
.day .d{font-weight:700;font-size:.95rem}
.day .r{font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.day.today{box-shadow:0 0 0 2px var(--done)}
.day[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.day[aria-pressed="true"] .r{color:var(--bg);opacity:.85}
.day.sat .d{color:var(--done)}
.day.sat[aria-pressed="true"] .d{color:var(--bg)}
.allbtn{font:inherit;font-size:.8rem;background:none;border:0;color:var(--accent);cursor:pointer;padding:0;text-decoration:underline}
.passage{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 18px}
.passage summary{cursor:pointer;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;list-style:none}
.passage summary::-webkit-details-marker{display:none}
.passage summary::before{content:"▸";color:var(--accent);font-weight:700;transition:transform .2s}
.passage[open] summary::before{transform:rotate(90deg)}
.ps-title{font-family:var(--display);font-weight:700;font-size:1.1rem}
.ps-sub{font-size:.8rem;color:var(--muted)}
.passage[open] .ps-sub{display:none}
.ps-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:6px}
.passage h2{font-family:var(--display);font-size:1.2rem;margin:0}
.passage h3{font-family:var(--display);font-size:1.05rem;margin:10px 0 4px;color:var(--accent)}
.ps-text{font-size:1.02rem;line-height:1.85;margin:6px 0 8px}
.ps{cursor:pointer;border-radius:4px;padding:1px 0;transition:background .2s}
.ps:hover{background:var(--accent-soft)}
.ps.on{background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent-soft)}
.ps .mk-y{background:#ffe066;color:#1f2620;border-radius:3px;box-shadow:0 0 0 2px #ffe066}
.ps .mk-r{background:#ff9e8f;color:#1f2620;border-radius:3px;box-shadow:0 0 0 2px #ff9e8f}
.revhead{list-style:none;display:grid;gap:2px;padding:8px 4px 2px;font-size:.84rem;color:var(--muted)}
.revhead b{color:var(--done);font-size:.92rem}
.revhead.today b{color:var(--accent)}
.wbadge{font-size:.76rem;color:var(--warn);font-variant-numeric:tabular-nums}
.wbadge.good{color:var(--accent)}
.tool{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 18px}
.tool summary{cursor:pointer;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;list-style:none}
.tool summary::-webkit-details-marker{display:none}
.tool summary::before{content:"▸";color:var(--accent);font-weight:700;transition:transform .2s}
.tool[open] summary::before{transform:rotate(90deg)}
.t-title{font-weight:700;font-size:1rem}
.t-sub{font-size:.8rem;color:var(--muted)}
.seq,.mock,.weak{display:grid;gap:10px;margin-top:12px}
.seq-step{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.seq-prev,.seq-q{display:grid;gap:3px;background:var(--bg);border-radius:10px;padding:10px 12px}
.seq-prev span,.seq-q span{font-size:.74rem;font-weight:700;color:var(--muted);letter-spacing:.02em}
.seq-prev{color:var(--muted)}
.seq-q b{font-size:1.02rem}
.seq-q em{font-style:normal;color:var(--muted);font-size:.86rem}
.seq-q em.dim{opacity:.7}
.seq-act{display:flex;flex-wrap:wrap;gap:6px}
.seq-act .primary,.seq-act .ghost{padding:7px 14px;font-size:.84rem}
.seq-act button:disabled{opacity:.4}
.mock p{margin:0;font-size:.88rem}
.mk-ko{font-size:1rem;background:var(--bg);border-radius:10px;padding:10px 12px}
.mock textarea{font:inherit;font-size:.95rem;line-height:1.45;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);width:100%;resize:vertical}
.mk-total{display:flex;align-items:baseline;gap:10px}
.mk-total b{font-family:var(--display);font-size:1.8rem;color:var(--accent);font-variant-numeric:tabular-nums}
.mk-total span{font-size:.84rem;color:var(--muted)}
.mk-list{display:grid;gap:8px;padding:0;margin:0;list-style:none}
.mk-list li{background:var(--bg);border-radius:10px;padding:8px 10px;display:grid;gap:4px;font-size:.88rem}
.mk-list li.ok{background:var(--done-soft)}
.mk-h{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;font-size:.8rem;color:var(--muted)}
.mk-h b{color:var(--fg);font-variant-numeric:tabular-nums}
.mk-h em{font-style:normal}
.mk-hist{font-size:.8rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.mk-hist b{color:var(--fg)}
.wk-sec{font-size:.78rem;font-weight:700;color:var(--muted);letter-spacing:.02em}
.wk-list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.weakgo{width:100%;text-align:left;font:inherit;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;display:grid;grid-template-columns:auto auto 1fr;gap:4px 10px;align-items:baseline;color:var(--fg)}
.weakgo span{font-size:.78rem;color:var(--muted)}
.weakgo b{color:var(--warn);font-variant-numeric:tabular-nums}
.weakgo em{font-style:normal;font-size:.84rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wk-words{display:flex;flex-wrap:wrap;gap:6px}
.wk-words span{background:var(--done-soft);border-radius:999px;padding:3px 10px;font-size:.84rem;font-weight:600}
.wk-words i{font-style:normal;font-size:.72rem;color:var(--muted);margin-left:4px}
.weak .ghost{justify-self:start;padding:5px 12px;font-size:.78rem}
.adminfoot{text-align:center;margin:28px 0 0}
.copyright-note{text-align:center;font-size:.72rem;line-height:1.6;color:var(--muted);margin:10px 0 0;opacity:.85}
.adminfoot button{font:inherit;font-size:.76rem;color:var(--muted);background:none;border:0;cursor:pointer;opacity:.7}
.howto{margin-top:12px;font-size:.82rem;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:10px 14px;display:grid;gap:3px}
.howto>b{color:var(--fg);font-size:.88rem}
.ps .mk-y{background:#ffe066;color:#1f2620;border-radius:3px;box-shadow:0 0 0 2px #ffe066}
.toast{position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:.82rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:40;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.howto+*{}
.ps-ko{display:block;font-size:.84rem;color:var(--muted);line-height:1.5;margin:0 0 8px}
.sumrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:.85rem;color:var(--muted);margin:10px 0 12px}
.sumrow b{color:var(--fg);font-size:.9rem}
.sumrow .pc{font-variant-numeric:tabular-nums}
.sumrow .bar{flex:1;min-width:80px}
.sumrow .alllink{margin-left:auto}
.progress{display:flex;align-items:center;gap:10px;font-size:.85rem;color:var(--muted);margin:10px 0 12px}
.bar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--done);width:0;transition:width .3s}
.modes{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin:0 -16px 10px;padding:5px 16px;border-bottom:1px solid var(--line)}
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.mgrid .chip{width:100%;text-align:center;padding:6px 6px;font-size:.82rem;white-space:nowrap;line-height:1.2}
body.typing .dock{display:none}
body.typing .modes{position:static}
ol{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.card.playing{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.card.done{background:var(--done-soft)}
.num{font-family:var(--display);font-weight:700;color:var(--accent);font-size:1.1rem;font-variant-numeric:tabular-nums;grid-column:1;grid-row:1 / span 4}
.card > :not(.num){grid-column:2;min-width:0}
.en .mk-y{background:#ffe066;color:#1f2620;border-radius:3px;box-shadow:0 0 0 2px #ffe066}
.en .mk-r{background:#ff9e8f;color:#1f2620;border-radius:3px;box-shadow:0 0 0 2px #ff9e8f}
.mkl{font-size:.82rem;display:flex;flex-wrap:wrap;gap:6px;align-items:center;color:var(--muted)}
.mkl span{padding:1px 8px;border-radius:999px;color:#1f2620;font-weight:600}
.mkl .mk-y{background:#ffe066}.mkl .mk-r{background:#ff9e8f}
.mkbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(120px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;align-items:center;gap:8px;background:var(--fg);color:var(--bg);padding:8px 10px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.25);font-size:.82rem;white-space:nowrap}
.mkbar[hidden]{display:none}
.mkb{font:inherit;font-weight:700;border:0;border-radius:999px;padding:6px 12px;cursor:pointer;color:#1f2620}
.mkb.y{background:#ffe066}.mkb.r{background:#ff9e8f}.mkb.x{background:var(--bg);color:var(--fg)}
.en{font-size:1.02rem;font-weight:500;cursor:pointer}
.en .hid{color:transparent;background:var(--line);border-radius:3px}
.ko{color:var(--muted);font-size:.85rem}
.ko.empty{font-style:italic;opacity:.7}
.voc summary{cursor:pointer;font-size:.8rem;font-weight:700;color:var(--accent);padding:2px 0}
.voc dl{margin:6px 0 2px;display:grid;gap:4px;border-top:1px dashed var(--line);padding-top:6px}
.vi{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:8px;font-size:.84rem;align-items:baseline}
.vi dt{font-weight:600;display:flex;gap:4px;align-items:baseline;min-width:0}
.vi dd{margin:0;color:var(--muted);min-width:0}
.vplay{border:0;background:none;padding:0 2px;cursor:pointer;font-size:.8rem;line-height:1;color:var(--fg)}
@media (max-width:420px){.vi{grid-template-columns:1fr}.vi dd{padding-left:22px;margin-top:-2px}}
.vmore{border:0;background:none;padding:0 0 0 4px;cursor:pointer;font:inherit;font-size:.76rem;font-weight:700;color:var(--accent);white-space:nowrap}
.vdet{grid-column:1/-1;background:var(--accent-soft);border-radius:10px;padding:10px 12px;margin:2px 0 6px;display:grid;gap:8px;font-size:.84rem;color:var(--fg)}
.vdet h4{margin:0 0 2px;font-size:.72rem;letter-spacing:.06em;color:var(--accent)}
.vdet p{margin:0}
.vdet ul{margin:0;padding-left:1.1em;display:grid;gap:4px}
.vdet .ko{font-size:.8rem}
.vdet .sim{display:flex;flex-wrap:wrap;gap:6px}
.vdet .sim span{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:.78rem}
.qa{border-top:1px dashed var(--line);padding-top:8px;display:grid;gap:8px}
.qa-item{display:grid;gap:3px}
.qa-q{font-weight:700;font-size:.82rem}
.qa-a{white-space:pre-wrap;font-size:.84rem;background:var(--surface);border-radius:8px;padding:8px 10px}
.qa-form{display:flex;gap:6px}
.qa-form input{flex:1;min-width:0;font:inherit;font-size:.86rem;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.qa-form .primary{padding:8px 12px;font-size:.84rem}
.vdet .load{color:var(--muted)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.acts button{font:inherit;font-size:.8rem;padding:5px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
.pending{display:flex;gap:10px;align-items:flex-start;background:var(--done-soft);border:1px solid var(--done);border-radius:12px;padding:10px 12px;margin:10px 0 4px;font-size:.84rem}
.pending b{display:block;color:var(--fg);font-size:.9rem}
.pending span{color:var(--muted)}
.pending .dot{flex:none;width:10px;height:10px;margin-top:6px;border-radius:50%;background:var(--done);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.pending .dot{animation:none}}
.acts .play.waiting{background:var(--surface);color:var(--muted);border-color:var(--line);font-weight:500}
.vplay.waiting{opacity:.6}
.acts .play{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:700;position:relative;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.acts .play::after{content:"";position:absolute;inset:0;background:var(--done);transform:scaleX(0);transform-origin:left;opacity:.55;pointer-events:none}
.acts .play.pressing::after{transform:scaleX(1);transition:transform 1s linear}
.acts .play.looping{background:var(--done);border-color:var(--done)}
.hint.press{margin:2px 0 10px}
.acts .write[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.wr{display:grid;gap:6px;margin-top:6px}
.wr textarea{font:inherit;font-size:.95rem;line-height:1.45;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);width:100%;resize:vertical}
.wr-act{display:flex;gap:6px}
.wr-act .primary,.wr-act .ghost{padding:6px 14px;font-size:.84rem}
.wr-res{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:grid;gap:6px;font-size:.88rem}
.wr-res.perfect{background:var(--done-soft);border-color:var(--done)}
.wr-score{font-size:.84rem;color:var(--muted)}
.wr-score b{color:var(--fg)}
.wr-diff{line-height:1.8}
.wr-diff .ok,.wr-legend .ok{color:var(--accent)}
.wr-diff .miss,.wr-legend .miss{color:var(--done);text-decoration:underline;text-decoration-style:dotted;font-weight:700}
.wr-diff .bad,.wr-legend .bad{color:var(--warn);text-decoration:line-through}
.wr-legend{font-size:.74rem;display:flex;flex-wrap:wrap;gap:4px 10px}
.wr-diff .sub,.wr-legend .sub{background:var(--done-soft);border-radius:4px;padding:0 3px;white-space:nowrap}
.wr-diff .sub s,.wr-legend .sub s{color:var(--warn)}
.wr-diff .sub b,.wr-legend .sub b{color:var(--done)}
.allrow{margin:-4px 0 10px}
.alllink{font:inherit;font-size:.82rem;font-weight:700;color:var(--accent);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}
.acts .hideen[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.acts .reveal[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.acts .mark[aria-pressed="true"]{background:var(--done);color:var(--bg);border-color:var(--done)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:18px;display:grid;gap:10px}
.panel h2{font-family:var(--display);font-size:1.25rem;margin:0}
.panel label{font-size:.82rem;font-weight:700;display:grid;gap:4px}
.panel input,.panel textarea{font:inherit;font-weight:400;font-size:.92rem;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);width:100%}
.panel textarea{min-height:200px;resize:vertical;line-height:1.5}
.hint{font-size:.78rem;color:var(--muted);margin:0}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.primary{font:inherit;font-weight:700;padding:9px 16px;border-radius:10px;border:0;background:var(--accent);color:var(--bg);cursor:pointer}
.primary:disabled{opacity:.5;cursor:default}
.ghost{font:inherit;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
.danger{color:var(--warn);border-color:var(--warn)}
.status{font-size:.84rem;color:var(--accent);min-height:1.2em;margin:0}
.status.err{color:var(--warn)}
.admin{margin-top:22px;font-size:.82rem;color:var(--muted)}
.admin summary{cursor:pointer;width:max-content;padding:4px 0}
.confirm{display:flex;flex-wrap:wrap;align-items:center;gap:6px;width:100%;font-size:.8rem;color:var(--fg);background:var(--done-soft);border-radius:8px;padding:8px 10px}
.confirm[hidden]{display:none}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tools button{font:inherit;font-size:.8rem;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.empty-state{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:24px 18px;text-align:center;color:var(--muted)}
.empty-state b{color:var(--fg);display:block;font-size:1.05rem;margin-bottom:4px}

.who b{color:var(--fg)}
.who button{margin-left:auto;font:inherit;font-size:.78rem;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.ro{background:var(--done-soft);border-radius:10px;padding:8px 12px;font-size:.8rem;margin:0 0 12px}

<script>
/* ===== 서버 연결층: GitHub Pages 화면 ↔ Apps Script API(저장·AI) / 음성은 이 저장소의 audio 폴더 ===== */
(function(){
  const API=(window.APP_CONFIG||{}).api||'';
  const errCode=m=>/not_granted/.test(m)?'not_granted':/rate_limited/.test(m)?'rate_limited':/invalid_json/.test(m)?'invalid_json':/not_admin/.test(m)?'invalid_argument':'upstream_error';
  /* 스터디 입장 코드: 서버가 코드를 요구하면 입력창을 띄우고, 맞으면 이 기기에 기억 */
  const getCode=()=>{try{return localStorage.getItem('studyCode')||''}catch(e){return ''}};
  async function raw(fn,args,code){
    let r;
    for(let t=0;;t++){
      try{r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn,args,code}),redirect:'follow'});break}
      catch(e){if(t>=1)throw{code:'network',message:String(e)};await new Promise(z=>setTimeout(z,1200))}
    }
    let j;try{j=await r.json()}catch(e){throw{code:'upstream_error',message:'bad_response '+r.status}}
    return j||{};
  }
  let codeP=null;
  function askCode(wrong){
    if(codeP)return codeP;
    codeP=new Promise(done=>{
      const box=document.createElement('div');box.className='gate';box.id='codeGate';box.style.zIndex='60';
      box.innerHTML=`<form class="gate-card" id="codeForm"><div class="eyebrow">입트영 스터디</div><h2>스터디 입장 코드</h2>
        <p>스터디 멤버에게 공유된 입장 코드를 입력하세요. 한 번 입력하면 이 기기에서 기억합니다.</p>
        <input id="codeInput" maxlength="40" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="입장 코드">
        <button class="primary" type="submit">확인</button><p class="status${wrong?' err':''}" id="codeMsg">${wrong?'저장된 코드가 바뀌었습니다. 새 코드를 입력해 주세요.':''}</p>
        <p class="hint" style="font-size:.78rem;color:var(--muted)">본 지문·음성의 저작권은 EBS 「입이 트이는 영어」에 있으며, 스터디 구성원의 내부 학습용으로만 사용합니다.</p></form>`;
      document.body.appendChild(box);setTimeout(()=>{const i=document.getElementById('codeInput');if(i)i.focus()},50);
      box.querySelector('form').addEventListener('submit',async e=>{
        e.preventDefault();const v=document.getElementById('codeInput').value.trim(),m=document.getElementById('codeMsg');
        if(!v){m.textContent='코드를 입력해 주세요.';m.className='status err';return}
        m.textContent='확인하는 중…';m.className='status';
        try{const j=await raw('checkCode',[v],'');if(j.res===true){try{localStorage.setItem('studyCode',v)}catch(_){};box.remove();codeP=null;done(v)}else{m.textContent='코드가 맞지 않습니다. 스터디 단톡방의 코드를 확인해 주세요.';m.className='status err'}}
        catch(_){m.textContent='연결이 불안정합니다. 다시 눌러 주세요.';m.className='status err'}
      });
    });
    return codeP;
  }
  async function run(fn,...args){
    if(!API||/여기에/.test(API))throw{code:'upstream_error',message:'no_api'};
    let j=await raw(fn,args,getCode());
    if(j.err==='need_code'){const had=!!getCode();try{localStorage.removeItem('studyCode')}catch(_){};const c=await askCode(had);j=await raw(fn,args,c)}
    if(j.err)throw{code:errCode(j.err),message:j.err};
    return j.res;
  }
  window.__run=run;
  window.__features={ai:false,tts:true};
  const aiP=run('features').then(f=>{window.__features={...window.__features,...(f||{}),tts:true};return !!(f&&f.ai)}).catch(()=>false);
  let adminPw='';try{adminPw=localStorage.getItem('adminPw')||''}catch(e){}

  /* 음성 목록(audio/index.json): GitHub Actions가 새 음성을 만들 때마다 갱신 */
  let ix=new Set();
  async function loadIndex(){try{const r=await fetch('audio/index.json?t='+Date.now(),{cache:'no-store'});if(r.ok)ix=new Set(await r.json())}catch(e){}}
  const clean=t=>String(t||'').replace(/\(.*?\)/g,'').replace(/[가-힣~]+/g,'').replace(/\+.*$/,'').trim()||String(t||'');
  const vkey=t=>clean(t).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')||'x';
  function attach(all){
    const has=n=>ix.has(n)?'audio/'+n:'';
    Object.keys(all).forEach(id=>{
      const w=all[id];if(!w||!w.sentences)return;const wk='w'+id.replace(/-/g,'');
      w.sentences.forEach((s,i)=>{
        const p=String(i).padStart(2,'0');
        if(!s.audio)s.audio=has(`${wk}-s${p}.mp3`);
        const am=(s.alt&&s.alt.am)||has(`${wk}-m-s${p}.mp3`),bf=(s.alt&&s.alt.bf)||has(`${wk}-b-s${p}.mp3`);
        if(am||bf)s.alt={...(s.alt||{}),am,bf};
        (s.vocab||[]).forEach(v=>{if(!v.audio)v.audio=has('v-'+vkey(v.t)+'.mp3')});
      });
      if(!w.longAudio)w.longAudio=has(`${wk}-long2.mp3`);
    });
    return all;
  }

  /* 주차 데이터: 처음 불러오고 1분마다 새로고침 */
  let cache={},listeners=[],pollT=null;
  const snap=()=>({docs:Object.keys(cache).sort().reverse().map(id=>({id,exists:true,data:()=>cache[id]}))});
  const emit=()=>{listeners.forEach(l=>{try{l.next(snap())}catch(e){}})};
  /* 바뀐 게 없으면 화면을 다시 그리지 않고, 글을 쓰는 중이면 다 쓴 뒤에 반영 (아이패드에서 화면이 튀는 것 방지) */
  let lastSig='',pendingEmit=false;
  const typing=()=>{const a=document.activeElement;return !!(a&&(a.tagName==='TEXTAREA'||a.tagName==='INPUT'||a.isContentEditable))};
  function emitSafe(){if(typing()){pendingEmit=true;return}pendingEmit=false;emit()}
  document.addEventListener('focusout',()=>{if(pendingEmit)setTimeout(()=>{if(pendingEmit&&!typing())emitSafe()},400)});
  /* 연결이 잠깐 끊겨도(화면 꺼짐·절전·와이파이 전환) 이미 받은 주차는 그대로 두고 다음 확인 때 다시 시도 */
  let loadedOnce=false;
  async function refresh(force){
    for(let t=0;;t++){
      try{const [wk]=await Promise.all([run('getWeeks'),loadIndex()]);loadedOnce=true;const next=attach(wk||{}),sig=JSON.stringify(next);if(!force&&sig===lastSig)return;lastSig=sig;cache=next;emitSafe();return}
      catch(e){
        if(loadedOnce)return;                                   // 이미 화면에 주차가 있으면 조용히 넘어감
        if(t<3){await new Promise(z=>setTimeout(z,2000*(t+1)));continue}   // 처음 열 때는 세 번 더 시도
        listeners.forEach(l=>l.err&&l.err(e));return;
      }
    }
  }
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&loadedOnce)refresh()});
  function poll(){if(pollT)return;pollT=setInterval(()=>{if(document.visibilityState==='visible')refresh()},60000)}
  function docRef(path){
    const p=path.split('/');
    if(p[0]==='weeks'){const id=p[1];return{
      get:async()=>{await refresh(true);return{exists:!!cache[id],data:()=>cache[id]}},
      set:async d=>{await run('saveWeek',id,d,false);cache[id]=attach({[id]:d})[id];emit()},
      update:async d=>{await run('saveWeek',id,d,true);cache[id]=attach({[id]:{...cache[id],...d}})[id];emit()},
      delete:async()=>{await run('deleteWeek',id,adminPw);delete cache[id];emit()}}}
    const key=p[p.length-1];
    return{get:async()=>{const r=await run('getProgress',key);return{exists:r.exists,data:()=>r.data}},
      set:d=>run('saveProgress',key,d),update:d=>run('saveProgress',key,d),delete:async()=>{}};
  }
  const db={doc:docRef,collection:path=>({doc:id=>docRef(path+'/'+id),orderBy(){return this},
    onSnapshot(next,err){listeners.push({next,err});refresh(true);poll();return()=>{}}})};

  /* AI: Apps Script에 넣어 둔 Gemini 무료 키로 답함 */
  const flat=i=>typeof i==='string'?i:i.map(m=>(m.role==='assistant'?'[이전 답변] ':'')+m.content).join('\n\n');
  const sample=async(input,opts={})=>{const text=await run('aiText',flat(input));if(opts.onText)opts.onText({text,delta:text});return{text,truncated:false}};
  sample.json=async input=>run('aiJson',flat(input));

  const user={isOwner:async()=>adminPw?!!(await run('checkAdmin',adminPw).catch(()=>false)):false,id:async()=>'m',can:async()=>true,profiles:async()=>({})};
  window.claude={use:async n=>n==='db'?db:n==='user'?user:n==='sample'?sample:null};
  window.__resolveAudio=async p=>p||'';

  /* 관리자 로그인 (주차 삭제·다시 정리용) */
  document.addEventListener('click',async e=>{
    if(!e.target||e.target.id!=='adminBtn')return;
    if(adminPw){if(confirm('관리자 로그아웃할까요?')){try{localStorage.removeItem('adminPw')}catch(_){}location.reload()}return}
    const pw=prompt('관리자 비밀번호를 입력하세요');if(!pw)return;
    const ok=await run('checkAdmin',pw).catch(()=>false);
    if(ok){try{localStorage.setItem('adminPw',pw)}catch(_){}location.reload()}else alert('비밀번호가 맞지 않습니다.');
  });
  document.addEventListener('DOMContentLoaded',()=>{const b=document.getElementById('adminBtn');if(b&&adminPw)b.textContent='🔐 관리자 (로그인됨)'});
})();

</script>
<script>
const DAYS=['월','화','수','목','금'];
const AUDIO_TASK='trig_0121mtZ6m1EASHAa2FwWubGH';
let mcp=null, downloads=null, db=null, sample=null, weeks=[], curId=null, view=null, mode='full', vocOpen=false, loaded=false, dbFailed=false;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ls={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ---------- dates ---------- */
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const mondayOf=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());const w=(x.getDay()+6)%7;return addDays(x,-w)};
const md=d=>`${d.getMonth()+1}/${d.getDate()}`;
const today=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())};

/* ---------- plan ---------- */
/* 주차 기준: 전주 토요일 스터디 다음 날(일) 시작 → 이번 주 토요일 스터디 */
const startOf=w=>addDays(parse(w.monday),-1), studyOf=w=>addDays(parse(w.monday),5), prevStudyOf=w=>addDays(parse(w.monday),-2);
/* 개인 학습 기록: 각자 계정의 비공개 공간(data/users/<id>)에 저장, 안 되면 이 기기에만 저장 */
let liveDb=false, readOnly=false, nick='', canWrite=true, prog={done:{},pace:{}}, progRef=null, progTimer=null, me=null, isOwner=false, userApi=null, names={};
/* 닉네임별 개인 기록: 이 기기에 닉네임 이름으로 저장 (Claude 로그인 시 계정에도 닉네임별로 저장) */
const progKey=()=>'prog:'+nick;
const hashNick=t=>{let h=5381;for(const ch of t)h=((h*33)^ch.codePointAt(0))>>>0;return h.toString(36)};
function loadLocalProg(){
  prog={done:{},pace:{},qa:{},marks:{},weak:{},tests:{}};
  try{
    let p=JSON.parse(localStorage.getItem(progKey())||'null');
    if(!p&&!localStorage.getItem('progMigrated')){
      const old=JSON.parse(localStorage.getItem('prog')||'null');
      if(old&&old.done)p=old;
      else{p={done:{},pace:{}};for(let n=0;n<localStorage.length;n++){const k=localStorage.key(n);if(k.startsWith('done:'))p.done[k.slice(5)]=JSON.parse(localStorage.getItem(k)||'{}');if(k.startsWith('pace:'))p.pace[k.slice(5)]=JSON.parse(localStorage.getItem(k)||'"auto"')}}
      localStorage.setItem('progMigrated','1');

function splitText(raw,title){
  const lines=raw.replace(/\r/g,'').split('\n').map(x=>x.trim()).filter(Boolean);
  let t=title.trim(), out=[];
  if(lines.length&&!/[.!?"”]$/.test(lines[0])&&lines[0].split(' ').length<=10){if(!t)t=lines[0];lines.shift()}
  for(const l of lines){out.push(...l.split(/(?<=[.!?]["”]?)\s+(?=[A-Z"“])/).map(x=>x.trim()).filter(Boolean))}
  const sentences=[];
  if(t)sentences.push({en:t,ko:'',vocab:[],isTitle:true});
  out.forEach(en=>sentences.push({en,ko:'',vocab:[]}));
  return {title:t||'제목 없음',sentences};
}

문장 목록:
${JSON.stringify(sentences.map(s=>s.en))}`;
  onStatus('해석과 단어·숙어를 정리하는 중… (30초~1분)');

}

    const known={};w.sentences.forEach(x=>(x.vocab||[]).forEach(v=>{if(v.audio)known[cleanTerm(v.t).toLowerCase()]=v.audio}));
    const clean=s.map((x,i)=>{const old=w.sentences[i];
      const o={en:x.en,ko:x.ko,vocab:x.vocab.map(v=>{const a=known[cleanTerm(v.t).toLowerCase()];return a?{...v,audio:a}:v})};
      if(x.isTitle)o.isTitle=true;if(old.audio)o.audio=old.audio;if(old.alt)o.alt=old.alt;return o});
    await db.doc('weeks/'+w.id).update({sentences:clean,updated:Date.now()});
    st.textContent='해석과 단어·숙어를 다시 정리했습니다.';
    if(clean.some(x=>x.vocab.some(v=>!v.audio)))requestAudio(w,st);
  }catch(e){st.textContent=errCopy(e.code);st.className='status err';btn.disabled=false}
}

/* ---------- boot ---------- */
render();
/* 닉네임 첫 화면 */
function nicks(){try{return JSON.parse(localStorage.getItem('nicks')||'[]')}catch(e){return[]}}
function showGate(){
  const g=$('gate');g.hidden=false;
  const list=nicks();
  $('nickList').innerHTML=list.length?list.map(n=>`<button type="button" data-nick="${esc(n)}">${esc(n)}</button>`).join(''):'';
  $('nickInput').value='';setTimeout(()=>{try{$('nickInput').focus()}catch(e){}},50);
}
function setNick(n){
  nick=n;try{localStorage.setItem('nick',n);const l=nicks().filter(x=>x!==n);l.unshift(n);localStorage.setItem('nicks',JSON.stringify(l.slice(0,8)))}catch(e){}
  $('gate').hidden=true;hiddenEn.clear();doneSeen.clear();hideSeed={};$('who').hidden=false;$('whoName').textContent=n;
  loadLocalProg();attachProgRef();full();
}
$('gateForm').addEventListener('submit',e=>{e.preventDefault();const v=$('nickInput').value.trim();if(!v){$('gateMsg').textContent='닉네임을 입력해 주세요.';$('gateMsg').className='status err';return}setNick(v)});
$('nickList').addEventListener('click',e=>{const b=e.target.closest('[data-nick]');if(b)setNick(b.dataset.nick)});
$('nickChange').onclick=()=>{stop();showGate()};
try{nick=localStorage.getItem('nick')||''}catch(e){}
if(nick){$('who').hidden=false;$('whoName').textContent=nick;loadLocalProg()}else showGate();
/* 드래그 선택 → 표시 도구 막대 */
let mkSel=null;
function readSel(){
  const sel=window.getSelection();if(!sel||sel.isCollapsed||!sel.rangeCount)return null;
  const r=sel.getRangeAt(0),a=r.commonAncestorContainer,el=(a.nodeType===1?a:a.parentElement);
  const en=el&&el.closest&&el.closest('.en,.ps');if(!en)return null;
  const inPs=en.classList.contains('ps'), i=inPs?+en.dataset.ps:+en.dataset.i;if(!inPs&&hiddenEn.has(i))return null;
  const ks=[...en.querySelectorAll('[data-w]')].filter(sp=>r.intersectsNode(sp)).map(sp=>+sp.dataset.w);
  return ks.length?{i,ks}:null;
}
document.addEventListener('selectionchange',()=>{clearTimeout(window.__mkT);window.__mkT=setTimeout(()=>{mkSel=readSel();$('mkbar').hidden=!mkSel},120)});
$('mkbar').addEventListener('pointerdown',e=>e.preventDefault());
$('mkbar').addEventListener('click',e=>{
  const b=e.target.closest('[data-mk]');if(!b||!mkSel||!curId)return;
  const c=b.dataset.mk;prog.marks=prog.marks||{};const wk=prog.marks[curId]=prog.marks[curId]||{};
  const m=wk[mkSel.i]={...(wk[mkSel.i]||{})};
  mkSel.ks.forEach(k=>{if(c==='x')delete m[k];else m[k]=c});
  if(!Object.keys(m).length)delete wk[mkSel.i];
  saveProg();try{window.getSelection().removeAllRanges()}catch(_){}
  mkSel=null;$('mkbar').hidden=true;render();
  toast(c==='x'?'표시를 지웠어요':'맨 아래 전체 지문에 노랑으로 표시했어요');
});
function toast(m){let t=$('toast');if(!t){t=document.createElement('div');t.id='toast';t.className='toast';document.body.appendChild(t)}t.textContent=m;t.classList.add('on');clearTimeout(window.__tT);window.__tT=setTimeout(()=>t.classList.remove('on'),1800)}
/* 2. 순서 연결 연습 */
const bodyOf=w=>w.sentences.map((_,i)=>i).filter(i=>!w.sentences[i].isTitle);
function seqHtml(w){
  const b=bodyOf(w);if(!b.length)return '';
  const p=Math.max(0,Math.min(seqPos,b.length-1)), j=b[p], cur=w.sentences[j];
  const ttl=w.sentences.find(x=>x.isTitle), prev=p===0?(ttl?ttl.en:'(시작)'):w.sentences[b[p-1]].en;
  return `<div class="seq">
    <div class="seq-step">${p+1} / ${b.length}</div>
    <div class="seq-prev"><span>${p===0?'제목':'앞 문장'}</span>${esc(prev)}</div>
    <div class="seq-q"><span>다음 문장은?</span>${seqShow?`<b>${esc(cur.en)}</b><em>${esc(cur.ko||'')}</em>`:seqHint?`<em>힌트: ${esc(cur.ko||'')}</em>`:`<em class="dim">소리 내어 말해 본 뒤 정답을 확인하세요</em>`}</div>
    <div class="seq-act">
      <button class="ghost" id="seqPrev"${p===0?' disabled':''}>◀ 이전</button>
      ${seqShow?'':`<button class="ghost" id="seqHint">${seqHint?'힌트 숨기기':'한글 힌트'}</button>`}
      <button class="${seqShow?'ghost':'primary'}" id="seqShow">${seqShow?'정답 숨기기':'정답 보기'}</button>
      ${seqShow?`<button class="ghost" id="seqPlay" data-j="${j}">▶ 듣기</button>`:''}
      <button class="primary" id="seqNext">${p===b.length-1?'처음부터':'다음 ▶'}</button>
    </div></div>`;
}
/* 3. 모의 테스트 */
function mockHtml(w){
  const b=bodyOf(w), hist=((prog.tests||{})[w.id]||[]).slice(-3).reverse();
  const histHtml=hist.length?`<div class="mk-hist">최근 기록: ${hist.map(h=>`<span>${new Date(h.at).toLocaleDateString('ko-KR',{month:'numeric',day:'numeric'})} <b>${h.score}점</b></span>`).join(' ')}</div>`:'';
  if(!mock||mock.wid!==w.id)return `<div class="mock"><p>토요일 테스트처럼 <b>한글 해석만 보고 ${b.length}문장을 순서대로</b> 써 봅니다. 마지막에 문장별 결과와 총점을 보여주고, 틀린 부분은 '내 약점'에 쌓입니다.</p><p class="hint">키보드 마이크로 말해서 입력하면 말하기 테스트 연습도 됩니다.</p>${histHtml}<button class="primary" id="mockStart">모의 테스트 시작</button></div>`;
  if(mock.res){
    const avg=Math.round(mock.res.reduce((a,r)=>a+(r?r.score:0),0)/b.length), perfect=mock.res.filter(r=>r&&r.perfect).length;
    return `<div class="mock"><div class="mk-total"><b>${avg}점</b><span>완벽 ${perfect} / ${b.length}문장</span></div>
      <ol class="mk-list">${b.map((j,k)=>{const r=mock.res[k];return `<li class="${r&&r.perfect?'ok':''}"><div class="mk-h"><span>${numLabel(w,j)}번</span><b>${r?r.score+'%':'미작성'}</b>${r&&!r.perfect?`<em>${errCount(r)}</em>`:''}</div>${r?(r.perfect?`<div class="wr-diff">${esc(w.sentences[j].en)}</div>`:diffHtml(r)):`<div class="wr-diff">${esc(w.sentences[j].en)}</div>`}</li>`}).join('')}</ol>
      ${histHtml}<div class="seq-act"><button class="primary" id="mockStart">다시 도전</button><button class="ghost" id="mockClose">닫기</button></div></div>`;
  }
  const k=mock.pos, j=b[k];
  return `<div class="mock"><div class="seq-step">${k+1} / ${b.length}</div>
    <div class="mk-ko">${esc(w.sentences[j].ko||'(해석 없음)')}</div>
    <textarea id="mockIn" rows="3" placeholder="영어 문장을 써 보세요" autocapitalize="sentences" spellcheck="false">${esc(mock.ans[k]||'')}</textarea>
    <div class="seq-act"><button class="ghost" id="mockPrev"${k===0?' disabled':''}>◀ 이전</button>
    ${k===b.length-1?`<button class="primary" id="mockGrade">채점하기</button>`:`<button class="primary" id="mockNext">다음 ▶</button>`}
    <button class="ghost" id="mockClose">그만하기</button></div></div>`;
}
/* 4. 내 약점 */
function weakHtml(w){
  const W=(prog.weak||{})[w.id]||{}, b=bodyOf(w);
  const rows=b.filter(j=>W[j]&&W[j].last<100).sort((x,y)=>W[x].last-W[y].last);
  const words={};b.forEach(j=>{const e=W[j];if(e&&e.words)for(const k in e.words)words[k]=(words[k]||0)+e.words[k]});
  const top=Object.entries(words).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const tried=b.filter(j=>W[j]).length, mastered=b.filter(j=>W[j]&&W[j].last===100).length;
  if(!tried)return `<p class="hint">아직 기록이 없어요. '✍ 써보기'나 '📝 모의 테스트'를 하면 자동으로 쌓입니다.</p>`;
  return `<div class="weak"><div class="mk-total"><b>${mastered}/${b.length}</b><span>최근 써보기 100% 문장 · ${tried}문장 연습함</span></div>
    ${rows.length?`<div class="wk-sec">다시 볼 문장</div><ul class="wk-list">${rows.map(j=>`<li><button class="weakgo" data-j="${j}"><span>${numLabel(w,j)}번</span><b>${W[j].last}%</b><em>${esc(w.sentences[j].en)}</em></button></li>`).join('')}</ul>`:`<p class="hint">연습한 문장은 최근에 모두 100%를 받았어요 👏</p>`}
    ${top.length?`<div class="wk-sec">자주 틀린 단어</div><div class="wk-words">${top.map(([k,n])=>`<span>${esc(k)}<i>${n}</i></span>`).join('')}</div>`:''}
    <button class="ghost" id="weakReset">기록 초기화</button></div>`;
}
document.addEventListener('input',e=>{if(e.target.id==='mockIn'&&mock)mock.ans[mock.pos]=e.target.value});
function applyWeeks(list){
  weeks=list.filter(w=>w.monday&&Array.isArray(w.sentences));loaded=true;dbFailed=false;
  if(!weeks.find(w=>w.id===curId)){
    const last=ls.get('lastWeek',null), thisMon=ymd(mondayOf(today()));
    curId=(weeks.find(w=>w.id===last)||weeks.find(w=>w.id===thisMon)||weeks[0]||{}).id||null;
    view=curId?todayView(weeks.find(w=>w.id===curId)):null;
  }
  if(!view&&curId)view=todayView(weeks.find(w=>w.id===curId));
  full();
}
/* 로그인 없이 여는 사람용: 주차 내용을 함께 실어 둔 공개 사본(data/weeks.json) */
async function loadPublic(final){if(final&&!liveDb){loaded=true;dbFailed=true;full()}}
(async()=>{
  const c=window.claude;
  if(!c){loadPublic(true);return}
  c.use('sample').then(s=>{sample=s}).catch(()=>{});
  db=await c.use('db').catch(()=>null);
  if(!db){loadPublic(true);return}
  userApi=await c.use('user').catch(()=>null);
  if(userApi){
    try{isOwner=!!(await userApi.isOwner())}catch(e){}
    try{me=await userApi.id()}catch(e){}
  }
  attachProgRef();
  db.collection('weeks').orderBy('monday','desc').onSnapshot(snap=>{
    liveDb=true;readOnly=false;canWrite=true;
    if(userApi)userApi.can('data.write').then(cw=>{if(cw===false&&canWrite){canWrite=false;full()}}).catch(()=>{});
    const list=snap.docs.map(d=>({id:d.id,...d.data()}));
    const ids=[...new Set(list.map(w=>w.addedBy).filter(x=>x&&!(x in names)))];
    if(ids.length&&userApi&&userApi.profiles)userApi.profiles(ids).then(ps=>{ids.forEach(id=>{names[id]=(ps&&ps[id]&&ps[id].name)||''});render()}).catch(()=>{});
    applyWeeks(list);
  },()=>{liveDb=false;db=null;loadPublic(true)});
})();
</script>
