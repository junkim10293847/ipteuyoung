name: 명화 이미지 받기
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['scripts/paintings.json', 'scripts/get_paintings.py']
permissions:
  contents: write
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/get_paintings.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img/paint
          git diff --cached --quiet || (git commit -m "명화 이미지 받기" && git pull --rebase && git push)
