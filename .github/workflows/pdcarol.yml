name: pdcarol
on: workflow_dispatch
permissions: {contents: write}
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - run: python3 scripts/pd_carols.py
      - run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add diag/pdcarol && git commit -qm "퍼블릭 도메인 캐럴 녹음 후보" && for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; done
