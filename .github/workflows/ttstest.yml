name: ttstest
on: workflow_dispatch
permissions: {contents: write}
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg >/dev/null
          pip install -q onnxruntime numpy "misaki[en]"
          python -m spacy download en_core_web_sm -q || true
          mkdir -p /tmp/kk && cd /tmp/kk
          curl -sSL -o int8.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.int8.onnx
          curl -sSL -o fp32.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -sSL -o voices.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - run: KK=/tmp/kk python scripts/tts_compare.py
      - run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add diag/tts && git commit -qm "음성 품질 비교 샘플" && for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; done
