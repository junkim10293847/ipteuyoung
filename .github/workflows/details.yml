name: 단어 설명 미리 만들기

on:
  schedule:
    - cron: '7,37 * * * *'      # 30분마다: 설명이 없는 단어·숙어가 있으면 미리 만들어 둠 (없으면 몇 초 만에 끝남)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: details
  cancel-in-progress: false

jobs:
  details:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python scripts/gen_details.py 2>&1 | tee /tmp/details.log
      - name: 기록 남기기 (최근 실행 결과)
        if: always()
        run: |
          mkdir -p diag && tail -80 /tmp/details.log > diag/details_log.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diag/details_log.txt && (git diff --cached --quiet || (git commit -q -m "단어 설명 미리 만들기 기록" && git pull -q --rebase && git push -q)) || true
