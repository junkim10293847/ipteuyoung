name: santa
on: workflow_dispatch
permissions: {contents: write}
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg >/dev/null
          pip install -q onnxruntime numpy "misaki[en]"
          python -m spacy download en_core_web_sm -q || true
          mkdir -p .kokoro && cd .kokoro
          curl -sSL -o kokoro.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -sSL -o voices.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - run: python scripts/santa.py
      - run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add diag/santa && git commit -qm "산타 효과음 후보" && for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; done
