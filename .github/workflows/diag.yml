name: 서버 점검
on:
  push:
    paths: [.github/workflows/diag.yml, diag/qa_test.py]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: 실제 사이트에서 질문 기능 점검
        run: |
          pip install -q playwright && python -m playwright install --with-deps chromium > /dev/null
          python diag/qa_test.py || true
      - name: 결과 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diag && git commit -q -m "질문 기능 점검 결과" && git pull -q --rebase && git push -q
